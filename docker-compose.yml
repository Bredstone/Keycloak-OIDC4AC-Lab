name: oidc4ac-native-lab

services:
  smtp4dev:
    image: rnwood/smtp4dev:v3@sha256:25c434c1900a9c5b61e17ead0a774d9e81b80554d05cf64719d69e5ea8c66537
    ports:
      - "127.0.0.1:${OIDC4AC_LAB_SMTP_PORT:-2525}:25"
      - "127.0.0.1:${OIDC4AC_LAB_SMTP_WEB_PORT:-5080}:80"

  test-client:
    build:
      context: ./test-client
      dockerfile: Dockerfile
    environment:
      OIDC_ISSUER: ${OIDC4AC_LAB_ISSUER:-http://keycloak.localhost:8080/realms/oidc4ac}
      OIDC_CLIENT_ID: oidc4ac-test-client
      OIDC_CLIENT_SECRET: oidc4ac-lab-client-secret
      FLASK_SECRET_KEY: ${OIDC4AC_LAB_FLASK_SECRET:-local-development-only-change-me}
      SMTP4DEV_URL: ${OIDC4AC_LAB_SMTP_WEB_URL:-http://localhost:5080}
      PORT: "${OIDC4AC_LAB_CLIENT_PORT:-5000}"
    network_mode: host
    extra_hosts:
      - keycloak.localhost:127.0.0.1
      - client.localhost:127.0.0.1

  e2e:
    profiles: ["e2e"]
    build:
      context: ./e2e/http
      dockerfile: Dockerfile
    environment:
      OIDC4AC_E2E_CLIENT_URL: http://client.localhost:${OIDC4AC_LAB_CLIENT_PORT:-5000}
      OIDC4AC_E2E_ISSUER: ${OIDC4AC_LAB_ISSUER:-http://keycloak.localhost:8080/realms/oidc4ac}
      OIDC4AC_E2E_SMTP4DEV_URL: ${OIDC4AC_LAB_SMTP_WEB_URL:-http://localhost:5080}
    depends_on:
      test-client:
        condition: service_started
      smtp4dev:
        condition: service_started
    network_mode: host
    extra_hosts:
      - client.localhost:127.0.0.1
      - keycloak.localhost:127.0.0.1

  browser-e2e:
    profiles: ["browser-e2e"]
    build:
      context: ./e2e/browser
      dockerfile: Dockerfile
    environment:
      OIDC4AC_BROWSER_CLIENT_URL: http://localhost:5003
      OIDC4AC_BROWSER_KEYCLOAK_URL: ${OIDC4AC_LAB_BROWSER_ISSUER_BASE:-http://localhost:8186}
    network_mode: host
    depends_on:
      browser-test-client:
        condition: service_started
      keycloak:
        condition: service_started

  browser-test-client:
    profiles: ["browser-e2e"]
    build:
      context: ./test-client
      dockerfile: Dockerfile
    environment:
      OIDC_ISSUER: http://localhost:8186/realms/oidc4ac
      OIDC_CLIENT_ID: oidc4ac-test-client
      OIDC_CLIENT_SECRET: oidc4ac-lab-client-secret
      FLASK_SECRET_KEY: ${OIDC4AC_LAB_FLASK_SECRET:-local-development-only-change-me}
      SMTP4DEV_URL: ${OIDC4AC_LAB_SMTP_WEB_URL:-http://localhost:5080}
      PORT: "5003"
    depends_on:
      keycloak:
        condition: service_started
    network_mode: host

  keycloak:
    profiles: ["browser-e2e"]
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${OIDC4AC_LAB_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OIDC4AC_LAB_ADMIN_PASSWORD:-admin}
      KC_LOG_LEVEL: ${OIDC4AC_LAB_KC_LOG_LEVEL:-INFO}
    depends_on:
      smtp4dev:
        condition: service_started
    command:
      - start-dev
      - --features=oidc4ac:v1,admin-fine-grained-authz:v2
      - --import-realm
      - --http-host=127.0.0.1
      - --http-port=8186
      - --hostname=http://localhost:8186
      - --hostname-strict=false
    network_mode: host

  keycloak-disabled:
    profiles: ["disabled-e2e"]
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${OIDC4AC_LAB_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OIDC4AC_LAB_ADMIN_PASSWORD:-admin}
      KC_LOG_LEVEL: ${OIDC4AC_LAB_KC_LOG_LEVEL:-INFO}
    command:
      - start-dev
      - --import-realm
      - --http-host=127.0.0.1
      - --http-port=8187
      - --hostname=http://localhost:8187
      - --hostname-strict=false
    network_mode: host
